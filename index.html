      font-size: 50px;

      margin-bottom: 8px;
    }

      margin: 8px 0 12px;
    }

    h1 {
      font-size: 32px;
    }

    h2 {

    }

    .subtitle {
      text-align: center;
      line-height: 1.8;
      color: #81556a;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #f3bfd4;
      border-radius: 16px;
      font-size: 17px;
      outline: none;
      text-align: right;
      margin-bottom: 12px;
      background: #fffafd;
    }

    input:focus {
      border-color: #e98caf;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 17px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .primary {
      background: linear-gradient(135deg, #ed79a6, #c94f83);
      color: white;
      box-shadow: 0 10px 25px rgba(201,79,131,.25);
    }

    .primary:hover {
      transform: translateY(-2px);
    }

    .secondary {
      margin-top: 12px;
      background: #fff0f6;
      color: #a33f68;
    }

    .error {
      min-height: 22px;
      color: #c03965;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
    }

    .hearts {
      text-align: center;
      font-size: 29px;
      letter-spacing: 5px;
      margin: 10px 0 18px;
    }

    .question-number {
      text-align: center;
      color: #a3657e;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 24px;
      line-height: 1.55;
      text-align: center;
      margin: 12px 0 22px;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      background: #fff7fa;
      color: #59263e;
      border: 2px solid #f4c6d8;
      text-align: right;
      transition: .18s;
    }

    .answer:hover {
      background: #ffeaf3;
      transform: translateY(-1px);
    }

    .answer:disabled {
      opacity: .75;
      cursor: default;
    }

    .score {
      font-size: 46px;
      font-weight: bold;
      text-align: center;
      color: #c64f82;
      margin: 12px 0;
    }

    .result-text {
      text-align: center;
      line-height: 1.8;
      color: #70465a;
    }

    .tiny {
      text-align: center;
      font-size: 12px;
      color: #a7798d;
      margin-top: 20px;
    }
  </style>
</head>

<body>

      correct: "الكوين جوجو لا تقارن بحدا"
    },

    {
      id: 22,
      question: "جودي بتحب الناس اللي... 💗",
      answers: ["يحبوا وجودها", "يتجاهلوها", "ينتقدوها باستمرار", "يحاولوا يغيروها"],
      correct: "يحبوا وجودها"
    },

    {
      id: 23,
      question: "قديش جودي بتقيّم نفسها؟ 👑",
      answers: ["10/10", "100/10", "1000/10", "الكوين جودي لا تقيم"],
      correct: "الكوين جودي لا تقيم"
    },

    {
      id: 24,
      question: "إذا بدنا نعرف مين الأولوية عند جودي... 💅",
      answers: ["آراء الناس", "نفسها", "كل شخص حولها", "رأي المجتمع"],
      correct: "نفسها"
    }
  ];


  /* =========================================================
     VARIABLES
     ========================================================= */

  const QUESTIONS_PER_GAME = 12;
  const MAX_HEARTS = 5;

  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let hearts = MAX_HEARTS;
  let playerName = "";
  let startedAt = null;
  let isSubmitting = false;


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const startScreen = document.getElementById("startScreen");
  const quizScreen = document.getElementById("quizScreen");
  const resultScreen = document.getElementById("resultScreen");

  const nameInput = document.getElementById("nameInput");
  const nameError = document.getElementById("nameError");

  const startBtn = document.getElementById("startBtn");

  const heartsEl = document.getElementById("hearts");
  const questionNumberEl = document.getElementById("questionNumber");
  const questionTextEl = document.getElementById("questionText");
  const answersEl = document.getElementById("answers");

  const finalScoreEl = document.getElementById("finalScore");
  const finalHeartsEl = document.getElementById("finalHearts");
  const resultTextEl = document.getElementById("resultText");

  const retryBtn = document.getElementById("retryBtn");
  const homeBtn = document.getElementById("homeBtn");


  /* =========================================================
     NAME VALIDATION
     يسمح بالحروف والمسافات والإيموجي
     ويمنع علامات الترقيم والرموز العادية
     ========================================================= */

  function removeEmoji(text) {
    return text.replace(
      /(?:\p{Extended_Pictographic}|\p{Emoji_Presentation})(?:\uFE0F|\u200D(?:\p{Extended_Pictographic}|\p{Emoji_Presentation})|\p{Emoji_Modifier})*/gu,
      ""
    );
  }

  function isValidName(name) {
    const clean = name.trim();

    if (!clean) return false;
    if (clean.length > 40) return false;

    const withoutEmoji = removeEmoji(clean)
      .replace(/\uFE0F/g, "")
      .replace(/\u200D/g, "");

    return /^[\p{L}\p{M}\s]+$/u.test(withoutEmoji);
  }


  /* =========================================================
     RANDOMIZATION
     ========================================================= */

  function shuffle(array) {
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
  }


  function chooseQuestions() {
    const previousIds = JSON.parse(
      localStorage.getItem("jojo_last_questions") || "[]"
    );

    let available = questionBank.filter(
      q => !previousIds.includes(q.id)
    );

    if (available.length < QUESTIONS_PER_GAME) {
      available = [...questionBank];
    }

    const selected = shuffle(available)
      .slice(0, QUESTIONS_PER_GAME)
      .map(q => ({
        ...q,
        answers: shuffle(q.answers)
      }));

    localStorage.setItem(
      "jojo_last_questions",
      JSON.stringify(selected.map(q => q.id))
    );

    return selected;
  }


  /* =========================================================
     HEARTS
     ========================================================= */

  function renderHearts() {
    heartsEl.textContent =
      "💗 ".repeat(hearts) +
      "🩶 ".repeat(MAX_HEARTS - hearts);
  }

  function renderFinalHearts() {
    finalHeartsEl.textContent =
      "💗 ".repeat(hearts) +
      "🩶 ".repeat(MAX_HEARTS - hearts);
  }


  /* =========================================================
     START
     ========================================================= */

  startBtn.addEventListener("click", startGame);

  nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      startGame();
    }
  });


  function startGame() {
    const name = nameInput.value.trim();

    if (!isValidName(name)) {
      nameError.textContent =
        "اكتب الاسم باستخدام الحروف والمسافات والإيموجي فقط.";
      return;
    }

    nameError.textContent = "";

    playerName = name;
    startedAt = new Date().toISOString();

    currentQuestions = chooseQuestions();
    currentQuestionIndex = 0;
    score = 0;
    hearts = MAX_HEARTS;
    isSubmitting = false;

    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");

    renderQuestion();
  }


  /* =========================================================
     SHOW QUESTION
     ========================================================= */

  function renderQuestion() {
    const q = currentQuestions[currentQuestionIndex];

    renderHearts();

    questionNumberEl.textContent =
      `السؤال ${currentQuestionIndex + 1}`;

    questionTextEl.textContent = q.question;

    answersEl.innerHTML = "";

    q.answers.forEach(answer => {
      const button = document.createElement("button");

      button.className = "answer";
      button.textContent = answer;

      button.addEventListener("click", () => {
        handleAnswer(answer, q.correct, button);
      });

      answersEl.appendChild(button);
    });
  }


  /* =========================================================
     ANSWER
     ========================================================= */

  function handleAnswer(selected, correct, clickedButton) {
    if (clickedButton.disabled) return;

    const allButtons = answersEl.querySelectorAll("button");

    allButtons.forEach(btn => {
      btn.disabled = true;
    });

    if (selected === correct) {
      score++;
    } else {
      hearts--;
    }

    setTimeout(() => {

      if (hearts <= 0) {
        finishGame();
        return;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex >= currentQuestions.length) {
        finishGame();
      } else {
        renderQuestion();
      }

    }, 250);
  }


  /* =========================================================
     FINISH + SAVE
     ========================================================= */

  async function finishGame() {
    if (isSubmitting) return;

    isSubmitting = true;

    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    finalScoreEl.textContent =
      `${score} / ${QUESTIONS_PER_GAME}`;

    renderFinalHearts();

    if (hearts <= 0) {
      resultTextEl.textContent =
        `انتهت القلوب. النتيجة محفوظة باسم ${playerName}.`;
    } else {
      resultTextEl.textContent =
        `خلصت المحاولة! النتيجة محفوظة باسم ${playerName}.`;
    }

    const { error } = await supabaseClient
      .from("quiz_attempts")
      .insert({
        name: playerName,
        score: score,
        total_questions: QUESTIONS_PER_GAME,
        hearts_left: hearts,
        started_at: startedAt
      });

    if (error) {
      console.error("Supabase error:", error);

      resultTextEl.textContent +=
        " لكن حدث خطأ أثناء حفظ النتيجة.";
    }
  }


  /* =========================================================
     RETRY
     ========================================================= */

  retryBtn.addEventListener("click", () => {
    startScreen.classList.remove("hidden");
    resultScreen.classList.add("hidden");

    nameInput.value = playerName;
    nameError.textContent = "";
  });


  homeBtn.addEventListener("click", () => {
    resultScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");

    nameInput.value = "";
    nameError.textContent = "";
  });
</script>
