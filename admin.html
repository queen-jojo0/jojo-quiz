<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jojo Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
      color: #6b2145;
    }

    .box {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(180,70,120,.15);
    }

    .login {
      max-width: 420px;
      text-align: center;
      margin-top: 90px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: 2px solid #f3b4cd;
      border-radius: 15px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 15px;
      background: #e889b2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      margin-top: 15px;
      color: #c62828;
    }

    .success {
      margin-top: 15px;
      color: #2e7d32;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      background: #777;
      margin-bottom: 15px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #f5d5e3;
    }

    th {
      background: #f8b6d0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #fff0f6;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="loginScreen" class="box login">

  <h1>👑 Jojo Admin</h1>

  <p>دخول الإدارة الخاص</p>

  <input
    id="email"
    type="email"
    placeholder="إيميل الإدارة"
    autocomplete="email"
  >

  <button onclick="sendLoginLink()">
    إرسال رابط الدخول 💗
  </button>

  <div id="message"></div>

</div>


<div id="adminScreen" class="box" style="display:none;">

  <button class="logout" onclick="logout()">
    خروج
  </button>

  <h1>نتائج اختبار جوجو 👑💗</h1>

  <div class="stats">

    <div class="stat">
      عدد المحاولات
      <strong id="attemptCount">0</strong>
    </div>

    <div class="stat">
      أعلى نتيجة
      <strong id="highestScore">0/12</strong>
    </div>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>التاريخ والوقت</th>
          <th>الاسم</th>
          <th>النتيجة</th>
        </tr>
      </thead>

      <tbody id="resultsBody"></tbody>

    </table>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://tferyxorlxacsvtafknu.supabase.co";
alert("JS اشتغل");
const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmZXJ5eG9ybHhhY3N2dGFma251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjcwMDUsImV4cCI6MjEwNTUwMzAwNX0.XTN9k_0qmwSCvQMG1er2s-5H-5XRk5edIC-8gat9VSg";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function sendLoginLink() {

  const email =
    document.getElementById("email").value.trim();

  const message =
    document.getElementById("message");

  message.className = "error";
  message.textContent = "";

  if (!email) {
    message.textContent =
      "اكتبي إيميل الإدارة أولًا.";
    return;
  }

  const { error } =
    await supabaseClient.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo:
          window.location.origin +
          "/jojo-quiz/admin.html"
      }
    });

  if (error) {

    message.textContent =
      "حدث خطأ: " + error.message;

    return;
  }

  message.className = "success";

  message.textContent =
    "تم إرسال رابط الدخول إلى إيميل الإدارة 💗";
}


async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    document.getElementById("loginScreen")
      .style.display = "none";

    document.getElementById("adminScreen")
      .style.display = "block";

    loadResults();
  }
}


async function loadResults() {

  const { data, error } =
    await supabaseClient
      .from("quiz_attempts")
      .select(
        "name, score, total_questions, started_at"
      )
      .order("started_at", {
        ascending: false
      });

  if (error) {

    document.getElementById("resultsBody")
      .innerHTML =
      "<tr><td colspan='3'>لا يمكن تحميل النتائج.</td></tr>";

    return;
  }

  const body =
    document.getElementById("resultsBody");

  body.innerHTML = "";

  document.getElementById("attemptCount")
    .textContent = data.length;

  let highest = 0;

  data.forEach(row => {

    if (row.score > highest) {
      highest = row.score;
    }

    const tr =
      document.createElement("tr");

    const date =
      new Date(row.started_at);

    tr.innerHTML = `
      <td>${date.toLocaleString("ar")}</td>
      <td>${escapeHtml(row.name)}</td>
      <td>${row.score}/${row.total_questions}</td>
    `;

    body.appendChild(tr);

  });

  document.getElementById("highestScore")
    .textContent = highest + "/12";
}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminScreen")
    .style.display = "none";

  document.getElementById("loginScreen")
    .style.display = "block";

  document.getElementById("email").value = "";
}


supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (session) {

      document.getElementById("loginScreen")
        .style.display = "none";

      document.getElementById("adminScreen")
        .style.display = "block";

      loadResults();

    }
  }
);


checkSession();

</script>

</body>
</html>
