<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jojo Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
      color: #6b2145;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .login-box,
    .admin-box {
      background: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(180, 70, 120, 0.15);
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #f3b4cd;
      border-radius: 15px;
      font-size: 17px;
      outline: none;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 15px;
      background: #e889b2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #c62828;
      margin-top: 12px;
      min-height: 22px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #fff0f6;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #f5d5e3;
      text-align: center;
    }

    th {
      background: #f8b6d0;
      color: #5d1739;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      margin-bottom: 15px;
      background: #777;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .login-box {
        margin: 40px auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen" class="login-box">
    <h1>👑 Jojo Admin</h1>
    <p>رمز الدخول السري</p>

    <input
      id="adminCode"
      type="password"
      placeholder="اكتبي الرمز"
      autocomplete="off"
    >

    <button onclick="loginAdmin()">
      دخول 🔐
    </button>

    <div id="loginError" class="error"></div>
  </div>


  <!-- ADMIN -->
  <div id="adminScreen" class="admin-box" style="display:none;">

    <button class="logout" onclick="logoutAdmin()">
      خروج
    </button>

    <h1>نتائج اختبار جوجو 👑💗</h1>

    <div class="stats">
      <div class="stat">
        عدد المحاولات
        <strong id="attemptCount">0</strong>
      </div>

      <div class="stat">
        أعلى نتيجة
        <strong id="highestScore">0/12</strong>
      </div>

      <div class="stat">
        آخر محاولة
        <strong id="latestAttempt">—</strong>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>التاريخ والوقت</th>
            <th>الاسم</th>
            <th>النتيجة</th>
            <th>القلوب المتبقية</th>
          </tr>
        </thead>

        <tbody id="resultsBody"></tbody>
      </table>
    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://tferyxorlxacsvtafknu.supabase.co";

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmZXJ5eG9ybHhhY3N2dGFma251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjcwMDUsImV4cCI6MjEwNTUwMzAwNX0.XTN9k_0qmwSCvQMG1er2s-5H-5XRk5edIC-8gat9VSgindex.html";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function loginAdmin() {

    const code =
      document.getElementById("adminCode").value.trim();

    const errorBox =
      document.getElementById("loginError");

    errorBox.textContent = "";

    if (!code) {
      errorBox.textContent =
        "اكتبي رمز الدخول أولًا 🔐";
      return;
    }

    const { data, error } =
      await supabaseClient.rpc(
        "admin_get_attempts",
        {
          input_code: code
        }
      );

    if (error) {
      console.error(error);

      errorBox.textContent =
        "رمز الدخول غير صحيح ❌";

      return;
    }

    document.getElementById("loginScreen").style.display =
      "none";

    document.getElementById("adminScreen").style.display =
      "block";

    showResults(data || []);
  }


  function showResults(rows) {

    const body =
      document.getElementById("resultsBody");

    body.innerHTML = "";

    document.getElementById("attemptCount").textContent =
      rows.length;


    let highest = 0;

    if (rows.length > 0) {

      rows.forEach(row => {

        if (row.score > highest) {
          highest = row.score;
        }

        const tr =
          document.createElement("tr");

        const date =
          new Date(row.started_at);

        tr.innerHTML = `
          <td>${date.toLocaleString("ar")}</td>
          <td>${escapeHtml(row.name)}</td>
          <td>${row.score}/${row.total_questions}</td>
          <td>${"💗".repeat(row.hearts_left)}${"💔".repeat(5 - row.hearts_left)}</td>
        `;

        body.appendChild(tr);
      });

      document.getElementById("highestScore").textContent =
        highest + "/12";

      const latestDate =
        new Date(rows[0].started_at);

      document.getElementById("latestAttempt").textContent =
        latestDate.toLocaleString("ar");

    } else {

      document.getElementById("highestScore").textContent =
        "0/12";

      document.getElementById("latestAttempt").textContent =
        "—";
    }
  }


  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
  }


  function logoutAdmin() {

    document.getElementById("adminScreen").style.display =
      "none";

    document.getElementById("loginScreen").style.display =
      "block";

    document.getElementById("adminCode").value =
      "";

    document.getElementById("resultsBody").innerHTML =
      "";

    document.getElementById("loginError").textContent =
      "";
  }

</script>

</body>
</html>
