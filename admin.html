<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Judy Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff1f7);
      color: #6b2145;
    }

    .box {
      max-width: 1000px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(180, 70, 120, 0.15);
    }

    .login {
      max-width: 430px;
      text-align: center;
      margin-top: 100px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: 2px solid #f3b4cd;
      border-radius: 15px;
      font-size: 18px;
      outline: none;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: #e889b2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      line-height: 1.6;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    .logout {
      width: auto;
      padding: 10px 20px;
      background: #777;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #fff0f6;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 7px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #f5d5e3;
    }

    th {
      background: #f8b6d0;
    }

    .empty {
      padding: 25px;
      text-align: center;
    }

    .hearts {
      font-size: 18px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen" class="box login">

    <h1>👑 Judy Admin</h1>

    <p>الدخول الخاص</p>

    <input
      id="codeInput"
      type="password"
      placeholder="رمز الدخول"
      autocomplete="off"
    >

    <button id="loginButton">
      دخول 👑
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminScreen" class="box" style="display:none;">

    <button id="logoutButton" class="logout">
      خروج
    </button>

    <h1>نتائج اختبار جوجو 👑💗</h1>

    <div class="stats">

      <div class="stat">
        عدد المحاولات
        <strong id="attemptCount">0</strong>
      </div>

      <div class="stat">
        أعلى نتيجة
        <strong id="highestScore">0/12</strong>
      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>التاريخ والوقت</th>
            <th>الاسم</th>
            <th>النتيجة</th>
            <th>القلوب المتبقية</th>
          </tr>
        </thead>

        <tbody id="resultsBody"></tbody>

      </table>

    </div>

  </div>


  <script>

    /* ==============================
       SUPABASE
       ============================== */

    const SUPABASE_URL =
      "https://tferyxorlxacsvtafknu.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmZXJ5eG9ybHhhY3N2dGFma251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjcwMDUsImV4cCI6MjEwNTUwMzAwNX0.XTN9k_0qmwSCvQMG1er2s-5H-5XRk5edIC-8gat9VSg";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==============================
       ELEMENTS
       ============================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminScreen =
      document.getElementById("adminScreen");

    const codeInput =
      document.getElementById("codeInput");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const message =
      document.getElementById("message");

    const resultsBody =
      document.getElementById("resultsBody");

    const attemptCount =
      document.getElementById("attemptCount");

    const highestScore =
      document.getElementById("highestScore");


    /* ==============================
       LOGIN
       ============================== */

    loginButton.addEventListener(
      "click",
      login
    );


    codeInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    async function login() {

      const code =
        codeInput.value.trim();

      message.className =
        "message";

      message.textContent = "";


      if (!code) {

        message.className =
          "message error";

        message.textContent =
          "اكتبي رمز الدخول.";

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "جاري التحقق...";


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "admin_get_attempts",
            {
              input_code: code
            }
          );


        if (error) {

          message.className =
            "message error";

          message.textContent =
            "رمز الدخول غير صحيح.";

          loginButton.disabled = false;

          loginButton.textContent =
            "دخول 👑";

          return;
        }


        sessionStorage.setItem(
          "judy_admin",
          "true"
        );


        loginScreen.style.display =
          "none";

        adminScreen.style.display =
          "block";


        displayResults(data || []);


      } catch (error) {

        message.className =
          "message error";

        message.textContent =
          "حدث خطأ أثناء التحقق.";

      }


      loginButton.disabled = false;

      loginButton.textContent =
        "دخول 👑";

    }


    /* ==============================
       DISPLAY RESULTS
       ============================== */

    function displayResults(data) {

      resultsBody.innerHTML = "";


      attemptCount.textContent =
        data.length;


      let highest = 0;


      if (data.length === 0) {

        resultsBody.innerHTML =
          `
          <tr>
            <td colspan="4" class="empty">
              لا توجد محاولات حتى الآن.
            </td>
          </tr>
          `;

        highestScore.textContent =
          "0/12";

        return;
      }


      data.forEach(function(row) {

        if (Number(row.score) > highest) {
          highest = Number(row.score);
        }


        const tr =
          document.createElement("tr");


        const date =
          new Date(row.started_at);


        const hearts =
          Number(row.hearts_left);


        let heartDisplay = "";


        for (
          let i = 0;
          i < hearts;
          i++
        ) {
          heartDisplay += "💗";
        }


        for (
          let i = hearts;
          i < 5;
          i++
        ) {
          heartDisplay += "🖤";
        }


        tr.innerHTML = `

          <td>
            ${date.toLocaleString("ar-QA", {
  timeZone: "Asia/Qatar",
  year: "numeric",
  month: "2-digit",
  day: "2-digit",
  hour: "2-digit",
  minute: "2-digit",
  hour12: true
})}
          </td>

          <td>
            ${escapeHtml(row.name)}
          </td>

          <td>
            ${row.score}/${row.total_questions}
          </td>

          <td class="hearts">
            ${heartDisplay}
          </td>

        `;


        resultsBody.appendChild(tr);

      });


      highestScore.textContent =
        highest + "/12";

    }


    /* ==============================
       SECURITY FOR NAMES
       ============================== */

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    /* ==============================
       LOGOUT
       ============================== */

    logoutButton.addEventListener(
      "click",
      function() {

        sessionStorage.removeItem(
          "judy_admin"
        );

        adminScreen.style.display =
          "none";

        loginScreen.style.display =
          "block";

        codeInput.value = "";

        message.textContent = "";

      }
    );


    /* ==============================
       REMEMBER LOGIN FOR THIS TAB
       ============================== */

    if (
      sessionStorage.getItem(
        "judy_admin"
      ) === "true"
    ) {

      /*
        لا نعرض البيانات القديمة
        بدون إعادة التحقق من الرمز.
        لذلك نترك شاشة الدخول.
      */

      sessionStorage.removeItem(
        "judy_admin"
      );

    }

  </script>

</body>

</html>
